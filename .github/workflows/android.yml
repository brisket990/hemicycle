name: Application Android
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.7"}
      - name: Compiler
        run: |
          set -o pipefail
          if ! gradle -p android assembleRelease --no-daemon 2>&1 | tee build.log; then
            awk '/What went wrong/{f=1} f&&n<25{print "::error::" $0; n++}' build.log
            grep -E "error:|\.java:[0-9]+" build.log | head -15 | sed 's/^/::error::/'
            exit 1
          fi
      - name: Publier l'APK
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk hemicycle.apk
          gh release delete android --yes --cleanup-tag || true
          gh release create android hemicycle.apk --title "Application Android" \
            --notes "APK de l'application Hémicycle (version ${{ github.run_number }}). Téléchargez hemicycle.apk sur votre téléphone puis ouvrez-le pour l'installer."
