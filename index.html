<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hémicycle des votes</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f3c88">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one column — scrutin picker, hemicycle, tally, groups table */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --fg:#1b2130; --muted:#5d6577; --line:#dde1e8;
  --accent:#1f3c88; --plan-fond:#eceef2; --plan-trait:#c9ced7; --plan-vide:#e3e6eb;
  --pour:#2e9e57; --contre:#d1443a; --abst:#8b919c; --absent:#c9ced7;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --surface:#1a1f29; --fg:#e7eaf0; --muted:#9aa2b2; --line:#2a3140;
  --accent:#8aa7ff; --plan-fond:#222835; --plan-trait:#3a4252; --plan-vide:#2a3140; --pour:#45c072; --contre:#ef6257; --abst:#8d94a1; --absent:#3a4252; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1a1f29; --fg:#e7eaf0; --muted:#9aa2b2; --line:#2a3140;
  --accent:#8aa7ff; --plan-fond:#222835; --plan-trait:#3a4252; --plan-vide:#2a3140; --pour:#45c072; --contre:#ef6257; --abst:#8d94a1; --absent:#3a4252; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.5rem;margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);margin:4px 0 0;font-size:.9rem}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,.btn{font:inherit;font-size:.9rem;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
select{flex:1 1 240px;min-width:0}
.btn{cursor:pointer;color:var(--accent);font-weight:600}
.btn:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.title{font-weight:600;font-size:1rem;margin:0;text-wrap:balance}
.meta{color:var(--muted);font-size:.82rem;margin-top:2px}
.tag{display:inline-block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--abst) 18%,transparent);color:var(--muted);margin-left:6px;vertical-align:middle}
.res{display:inline-block;font-weight:700;font-size:.8rem;padding:2px 10px;border-radius:99px;margin-top:8px}
.res.ok{background:color-mix(in srgb,var(--pour) 18%,transparent);color:var(--pour)}
.res.ko{background:color-mix(in srgb,var(--contre) 18%,transparent);color:var(--contre)}
svg{width:100%;height:auto;display:block}
.tally{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;font-size:.88rem;margin-top:4px}
.tally span{display:flex;align-items:center;gap:6px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}
.tip{min-height:1.4em;text-align:center;font-size:.85rem;color:var(--muted);margin-top:8px}
.tip b{color:var(--fg)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:left;font-weight:500;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;padding:0 6px 8px}
td{padding:6px;border-top:1px solid var(--line);vertical-align:middle}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--absent);min-width:80px}
.tablebox{overflow-x:auto}
.note{font-size:.8rem;color:var(--muted);line-height:1.5}
.note code{font-family:var(--mono);font-size:.78rem}
.seat{cursor:pointer;transition:opacity .2s}
svg.focus .seat{opacity:.12}
svg.focus .seat.on{opacity:1}
svg.focus circle.seat.on{stroke:var(--fg);stroke-width:1.6}
svg.plan .seat{stroke:var(--surface);stroke-width:1.2}
svg.plan .seat.nv{stroke:var(--abst);stroke-width:4}
svg.plan .seat.vide{fill:var(--plan-vide);cursor:default}
svg.plan .seat.found{stroke:var(--fg);stroke-width:6;opacity:1}
.plan-contour{fill:var(--plan-fond)}
.plan-trait{fill:var(--surface);stroke:var(--plan-trait)}
.plan-plein{fill:var(--plan-trait);stroke:var(--surface)}
.viewbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:.8rem;padding:6px 10px;border:0;background:var(--surface);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
#who{font:inherit;font-size:.85rem;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);flex:1 1 180px;min-width:0;max-width:280px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.chip{font:inherit;font-size:.78rem;font-weight:600;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;display:flex;gap:6px;align-items:center}
.chip small{font-family:var(--mono);font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chip[aria-pressed="true"] small{color:var(--surface)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip.all{color:var(--accent)}
#groups tr.on td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.pres{font-size:.85rem;text-align:center;margin-top:10px;color:var(--muted)}
.pres b{color:var(--fg)}
.pbar{height:6px;border-radius:3px;background:var(--absent);overflow:hidden;max-width:320px;margin:6px auto 0}
.pbar span{display:block;height:100%;background:var(--accent)}
.ring{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid var(--abst);box-sizing:border-box}
@media (prefers-reduced-motion:reduce){circle.seat{transition:none}}
.info{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:12px 0 4px;font-size:.86rem}
.info dt{color:var(--muted)}
.info dd{margin:0;min-width:0;overflow-wrap:anywhere}
.when{font-size:.88rem;margin-top:6px}
details.expose{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;font-size:.86rem}
details.expose summary{cursor:pointer;color:var(--accent);font-weight:600}
details.expose p{white-space:pre-line;line-height:1.55;margin:8px 0 0}
details.expose .src{color:var(--muted);font-size:.78rem;margin-top:6px}
input[type=search]{font:inherit;font-size:.9rem;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);flex:1 1 200px;min-width:0}
input[type=search]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
body{margin:0}
</style></head><body>

<div class="wrap">
  <header>
    <h1>Hémicycle des votes</h1>
    <p class="sub" id="status">Chargement des données…</p>
  </header>

  <div class="controls">
    <input id="q" type="search" placeholder="Filtrer : budget, crypto, amendement…" aria-label="Filtrer les scrutins">
    <select id="pick" aria-label="Scrutin"></select>
  </div>

  <section class="card">
    <p class="title" id="sTitle"></p>
    <div class="meta" id="sMeta"></div>
    <div class="when" id="sWhen"></div>
    <span class="res" id="sRes"></span>
    <div id="sInfo"></div>
    <div class="viewbar" id="viewbar" hidden>
      <div class="seg" role="group" aria-label="Disposition">
        <button id="vPlan" aria-pressed="true">Places réelles</button>
        <button id="vGroupe" aria-pressed="false">Par groupe</button>
      </div>
      <input id="who" list="whoList" placeholder="Situer un député…" aria-label="Situer un député">
      <datalist id="whoList"></datalist>
    </div>
    <svg id="hemi" viewBox="0 0 1000 520" role="img" aria-label="Hémicycle"></svg>
    <div class="tally" id="tally"></div>
    <div class="pres" id="pres"></div>
    <div class="chips" id="chips" role="group" aria-label="Mettre un groupe en évidence"></div>
    <div class="tip" id="tip"></div>
  </section>

  <section class="card tablebox">
    <table>
      <thead><tr><th>Groupe</th><th>Répartition</th><th style="text-align:right">Présents</th><th style="text-align:right">Pour</th><th style="text-align:right">Contre</th><th style="text-align:right">Abst.</th></tr></thead>
      <tbody id="groups"></tbody>
    </table>
  </section>

  <p class="note" id="foot"></p>
</div>

<script>
/* Ordre gauche → droite ; un groupe inconnu se place avant les non-inscrits. */
const ORDRE=["LFI-NFP","LFI","GDR","EcoS","ECOS","ECO","SOC","LIOT","EPR","RE","Dem","DEM","HOR","DR","LR","UDR","RN","NI"];
const rank=a=>{const i=ORDRE.findIndex(o=>o.toLowerCase()===String(a).toLowerCase());return i<0?ORDRE.length-1.5:i;};

function layout(total){
  const rows=12, r0=0.38, cx=500, cy=495, R=470;
  const radii=[...Array(rows)].map((_,i)=>r0+(1-r0)*i/(rows-1));
  const sumR=radii.reduce((a,b)=>a+b,0);
  const counts=radii.map(r=>Math.round(total*r/sumR));
  counts[rows-1]+=total-counts.reduce((a,b)=>a+b,0);
  const seats=[];
  radii.forEach((r,i)=>{const n=counts[i];
    for(let k=0;k<n;k++){const a=Math.PI-(Math.PI*(k+.5)/n);
      seats.push({a,r,x:cx+R*r*Math.cos(a),y:cy-R*r*Math.sin(a)});}});
  seats.sort((p,q)=>q.a-p.a||p.r-q.r);
  const dot=Math.min(R*(1-r0)/(rows-1), Math.PI*R/Math.max(1,counts[rows-1]))*0.42;
  return {seats,dot};
}

const COL={pour:"var(--pour)",contre:"var(--contre)",abst:"var(--abst)",nv:"none",absent:"var(--absent)"};
const LAB={pour:"Pour",contre:"Contre",abst:"Abstention",nv:"Présent, n'a pas voté",absent:"Absent"};
const svg=document.getElementById("hemi"), tip=document.getElementById("tip");
const NS="http://www.w3.org/2000/svg";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let REF={groupes:{},deputes:{}}, INDEX=null, cur=null, sel=null;
const count=ms=>{const c={pour:0,contre:0,abst:0,nv:0,absent:0};ms.forEach(m=>c[m.pos]++);c.pres=c.pour+c.contre+c.abst+c.nv;return c;};
const nom=id=>REF.deputes[id]?.nom||id||"";

function build(s){
  const groups=s.groupes.map(g=>{
    const info=REF.groupes[g.po]||{abrege:g.po,libelle:g.po};
    const m=[];const seen=new Set();
    for(const k of ["pour","contre","abst","nv"]) for(const id of g[k]){m.push({pos:k,id});seen.add(id);}
    for(const [id,d] of Object.entries(REF.deputes)) if(d.gp===g.po&&!seen.has(id)&&m.length<g.nb) m.push({pos:"absent",id});
    while(m.length<g.nb) m.push({pos:"absent"});
    return {code:info.abrege||g.po,nom:info.libelle||g.po,membres:m};
  });
  groups.sort((a,b)=>rank(a.code)-rank(b.code));
  return groups;
}

function render(s){
  const groups=build(s); cur={...s,groups}; sel=null;
  const flat=[];groups.forEach((g,gi)=>g.membres.forEach(m=>flat.push({...m,g,gi})));
  if(PLAN&&vue==="plan") drawPlan(flat); else drawGroupes(flat);
  const t=count(flat);
  document.getElementById("tally").innerHTML=["pour","contre","abst","nv","absent"].filter(k=>k!=="nv"||t.nv).map(k=>
    `<span>${k==="nv"?'<i class="ring"></i>':`<i class="dot" style="background:${COL[k]}"></i>`}${LAB[k]} <b class="num">${t[k]}</b></span>`).join("");
  document.getElementById("pres").innerHTML=`<b class="num">${t.pres}</b> présents sur <span class="num">${flat.length}</span> · <span class="num">${Math.round(100*t.pres/Math.max(1,flat.length))} %</span><div class="pbar"><span style="width:${100*t.pres/Math.max(1,flat.length)}%"></span></div>`;
  document.getElementById("sTitle").textContent=s.titre;
  const lien=`https://www.assemblee-nationale.fr/dyn/${INDEX.legislature}/scrutins/${s.n}`;
  document.getElementById("sMeta").innerHTML=`Scrutin n° ${s.n}${s.type?` · ${esc(s.type)}`:""} · <a href="${lien}" target="_blank" rel="noopener">voir sur le site de l'Assemblée</a>`;
  renderInfo(s);
  const adopt=s.sort?s.sort.startsWith("adopt"):t.pour>t.contre;
  const r=document.getElementById("sRes");r.textContent=adopt?"Adopté":"Rejeté";r.className="res "+(adopt?"ok":"ko");
  document.getElementById("chips").innerHTML=groups.map((g,gi)=>`<button class="chip" data-g="${gi}" aria-pressed="false" title="${esc(g.nom)}">${esc(g.code)}<small>${count(g.membres).pres}/${g.membres.length}</small></button>`).join("")
    +`<button class="chip all" id="all" hidden>Tout afficher</button>`;
  document.querySelectorAll(".chip[data-g]").forEach(b=>b.addEventListener("click",()=>select(+b.dataset.g)));
  document.getElementById("all").addEventListener("click",()=>select(null));
  document.getElementById("groups").innerHTML=groups.map((g,gi)=>{const c=count(g.membres);const n=g.membres.length||1;
    const seg=k=>`<span style="width:${100*c[k]/n}%;background:${COL[k]}"></span>`;
    return `<tr data-g="${gi}" style="cursor:pointer"><td title="${esc(g.nom)}"><b>${esc(g.code)}</b></td><td><div class="bar">${seg("pour")}${seg("contre")}${seg("abst")}</div></td>
      <td class="n">${c.pres}/${g.membres.length}</td><td class="n">${c.pour}</td><td class="n">${c.contre}</td><td class="n">${c.abst}</td></tr>`}).join("");
  document.querySelectorAll("#groups tr").forEach(tr=>tr.addEventListener("click",()=>select(+tr.dataset.g)));
  select(null);
}
const ORD=n=>n==1?"1re":`${n}e`;
function quand(s){
  const i=s.info||{};
  let txt="";
  try{txt=new Date(s.date+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});}catch(e){txt=s.date;}
  txt=txt.charAt(0).toUpperCase()+txt.slice(1);
  const parts=[`<b>${esc(txt)}</b>`];
  let seance=i.seanceNum?`${ORD(+i.seanceNum)} séance`:"";
  if(i.debutSeance){try{const h=new Date(i.debutSeance).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/Paris"}).replace(":","h");
    seance=(seance?seance+", ouverte":"Séance ouverte")+` à ${h}`;}catch(e){}}
  if(seance) parts.push(seance);
  return parts.join(" · ");
}
let PLAN=null, vue="plan";
function seatClick(m){select(m.gi,true);tip.innerHTML=`<b>${esc(nom(m.id)||"Député")}</b> · ${esc(m.g.code)} · ${LAB[m.pos]}`;}
function drawGroupes(flat){
  const {seats,dot}=layout(flat.length);
  svg.setAttribute("viewBox","0 0 1000 520");svg.classList.remove("plan");svg.innerHTML="";
  seats.forEach((p,i)=>{const m=flat[i];const c=document.createElementNS(NS,"circle");
    c.setAttribute("cx",p.x.toFixed(1));c.setAttribute("cy",p.y.toFixed(1));
    if(m.pos==="nv"){c.setAttribute("r",(dot*.8).toFixed(1));c.setAttribute("fill","none");
      c.style.stroke="var(--abst)";c.style.strokeWidth=(dot*.45).toFixed(1);}
    else{c.setAttribute("r",dot.toFixed(1));c.setAttribute("fill",COL[m.pos]);}
    c.setAttribute("class","seat g"+m.gi);if(m.id)c.dataset.id=m.id;
    const t=document.createElementNS(NS,"title");t.textContent=`${nom(m.id)} (${m.g.code}) · ${LAB[m.pos]}`;c.appendChild(t);
    c.addEventListener("click",()=>seatClick(m));
    svg.appendChild(c);});
}
function drawPlan(flat){
  const parId={};flat.forEach(m=>{if(m.id)parId[m.id]=m;});
  const occupant={};for(const [id,d] of Object.entries(REF.deputes)) if(d.place) occupant[d.place]=id;
  svg.setAttribute("viewBox",PLAN.viewBox);svg.classList.add("plan");svg.innerHTML="";
  const g=document.createElementNS(NS,"g");svg.appendChild(g);
  const mk=(it,cls)=>{const p=document.createElementNS(NS,"path");p.setAttribute("d",it.d);if(it.t)p.setAttribute("transform",it.t);p.setAttribute("class",cls);g.appendChild(p);return p;};
  PLAN.decor.forEach(it=>{const p=mk(it,"plan-"+it.k);if(it.w)p.style.strokeWidth=it.w;});
  for(const [num,it] of Object.entries(PLAN.places)){
    const id=occupant[num], m=id&&parId[id];
    const p=mk(it,"seat");
    const t=document.createElementNS(NS,"title");p.appendChild(t);
    if(!m){p.classList.add("vide");t.textContent=id?`${nom(id)} · n'était pas député lors de ce vote`:`Siège ${num} · inoccupé`;continue;}
    p.classList.add("g"+m.gi);p.dataset.id=id;
    if(m.pos==="nv"){p.classList.add("nv");p.style.fill="var(--surface)";}else p.style.fill=COL[m.pos];
    t.textContent=`${nom(id)} (${m.g.code}) · ${LAB[m.pos]}`;
    p.addEventListener("click",()=>seatClick(m));
  }
  if(PLAN.president){const c=document.createElementNS(NS,"circle");const P=PLAN.president;
    c.setAttribute("cx",P.cx);c.setAttribute("cy",P.cy);c.setAttribute("r",P.r);c.setAttribute("class","plan-plein");
    const t=document.createElementNS(NS,"title");t.textContent="Présidence de séance";c.appendChild(t);g.appendChild(c);}
}
function situer(){
  const v=document.getElementById("who").value.trim().toLowerCase();if(!v||!cur)return;
  const id=Object.keys(REF.deputes).find(k=>REF.deputes[k].nom.toLowerCase()===v)||Object.keys(REF.deputes).find(k=>REF.deputes[k].nom.toLowerCase().includes(v));
  svg.querySelectorAll(".found").forEach(e=>e.classList.remove("found"));
  if(!id){tip.textContent="Aucun député trouvé avec ce nom.";return;}
  const el=svg.querySelector(`[data-id="${id}"]`);
  let m=null;cur.groups.forEach((g,gi)=>g.membres.forEach(x=>{if(x.id===id)m={...x,g,gi};}));
  if(el){el.classList.add("found");}
  tip.innerHTML=m?`<b>${esc(nom(id))}</b> · ${esc(m.g.code)} · ${LAB[m.pos]}${REF.deputes[id].place?` · siège n° ${esc(REF.deputes[id].place)}`:""}`
    :`<b>${esc(nom(id))}</b> n'était pas député lors de ce vote.`;
}
function setVue(v){vue=v;document.getElementById("vPlan").setAttribute("aria-pressed",String(v==="plan"));
  document.getElementById("vGroupe").setAttribute("aria-pressed",String(v!=="plan"));if(cur)render(cur);}
function renderInfo(s){
  const i=s.info||{};
  document.getElementById("sWhen").innerHTML=quand(s);
  const rows=[];
  const add=(k,v)=>{if(v)rows.push(`<dt>${k}</dt><dd>${v}</dd>`);};
  add("Objet",esc(i.nature||""));
  if(i.texte) add("Texte",esc(i.texte.charAt(0).toUpperCase()+i.texte.slice(1))+(i.lecture?` <span style="color:var(--muted)">(${esc(i.lecture)})</span>`:""));
  if(i.article) add("Article",esc(i.article));
  if(i.amendement) add("Amendement",`n° ${i.amendement}`);
  add("Auteur",esc(i.auteur||""));
  add("Scrutin demandé par",esc(i.demandeur||""));
  if(i.requis) add("Majorité requise",`${esc(i.requis)} voix${i.exprimes?` sur ${esc(i.exprimes)} exprimées`:""}${i.majorite?` <span style="color:var(--muted)">(${esc(i.majorite.toLowerCase())})</span>`:""}`);
  if(i.dossier&&i.dossier.chemin) add("Dossier",`<a href="https://www.assemblee-nationale.fr/dyn/${INDEX.legislature}/dossiers/${encodeURIComponent(i.dossier.chemin)}" target="_blank" rel="noopener">${esc(i.dossier.titre||"Voir le dossier")}</a>`);
  let h=rows.length?`<dl class="info">${rows.join("")}</dl>`:"";
  if(i.expose) h+=`<details class="expose"><summary>Exposé sommaire de l'auteur</summary><p>${esc(i.expose)}</p><div class="src">Texte rédigé par l'auteur de l'amendement pour le justifier, tel que publié par l'Assemblée nationale. Il présente son point de vue.</div></details>`;
  document.getElementById("sInfo").innerHTML=h;
}
function select(gi,keep){
  if(!keep&&gi!==null&&gi===sel) gi=null;
  sel=gi;
  svg.classList.toggle("focus",gi!==null);
  svg.querySelectorAll(".seat").forEach(c=>c.classList.toggle("on",gi!==null&&c.classList.contains("g"+gi)));
  document.querySelectorAll(".chip[data-g]").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.g===gi)));
  document.querySelectorAll("#groups tr").forEach(tr=>tr.classList.toggle("on",+tr.dataset.g===gi));
  document.getElementById("all").hidden=gi===null;
  if(gi===null){tip.textContent="Touchez un groupe pour le mettre en évidence, ou un point pour voir le député.";return;}
  const g=cur.groups[gi],c=count(g.membres);
  tip.innerHTML=`<b>${esc(g.code)}</b> · ${esc(g.nom)} · ${c.pres} présents sur ${g.membres.length} · ${c.pour} pour, ${c.contre} contre, ${c.abst} abst.`;
}

const pick=document.getElementById("pick"), q=document.getElementById("q");
function fill(){
  const f=q.value.trim().toLowerCase();
  const list=INDEX.scrutins.filter(s=>!f||s.titre.toLowerCase().includes(f)||String(s.n)===f).slice(0,400);
  pick.innerHTML=list.map(s=>`<option value="${s.n}">${esc(s.date)} · n° ${s.n} · ${esc(s.titre.slice(0,110))}</option>`).join("")||"<option>Aucun scrutin</option>";
}
async function load(n){
  try{const s=await (await fetch(`data/s/${n}.json`)).json();render(s);}
  catch(e){tip.textContent=`Impossible de charger le scrutin n° ${n}.`;}
}
q.addEventListener("input",()=>{fill();if(pick.value)load(pick.value);});
pick.addEventListener("change",()=>load(pick.value));

(async()=>{
  try{
    [INDEX,REF]=await Promise.all([fetch("data/index.json").then(r=>r.json()),fetch("data/deputes.json").then(r=>r.json())]);
    try{PLAN=await fetch("data/plan.json").then(r=>r.ok?r.json():null);}catch(e){PLAN=null;}
  }catch(e){
    document.getElementById("status").textContent="Données introuvables : lancez d'abord « python3 update.py » dans ce dossier.";return;
  }
  document.getElementById("status").textContent=`${INDEX.scrutins.length} scrutins · ${INDEX.legislature}e législature · mis à jour le ${INDEX.maj.replace("T"," à ")}`;
  document.getElementById("foot").innerHTML=`Données : open data de l'Assemblée nationale (<a href="${esc(INDEX.source)}">fichier source</a>), converties sans retouche par update.py. Plan des sièges : Assemblée nationale (page « Situez votre député »). Sur le plan, chaque siège montre son occupant actuel ; un député remplacé depuis un vote ancien n'y figure pas mais reste compté dans les totaux. Les informations sur chaque scrutin (objet, texte, auteur, horaire de la séance) viennent des mêmes fichiers officiels. Seuls les scrutins publics ont un détail nominatif. Les votes par délégation comptent comme présents.`;
  document.getElementById("whoList").innerHTML=Object.values(REF.deputes).map(d=>`<option value="${esc(d.nom)}">`).join("");
  document.getElementById("who").addEventListener("change",situer);
  document.getElementById("viewbar").hidden=false;
  if(PLAN){document.getElementById("vPlan").addEventListener("click",()=>setVue("plan"));document.getElementById("vGroupe").addEventListener("click",()=>setVue("groupe"));}
  else{vue="groupe";document.querySelector("#viewbar .seg").hidden=true;}
  fill(); if(INDEX.scrutins.length) load(INDEX.scrutins[0].n);
})();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
</body></html>
